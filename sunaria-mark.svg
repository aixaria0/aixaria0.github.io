<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">Sunaria SA monogram</title>
  <desc id="desc">A sharp A intertwined with a flowing S ribbon, orbit and four-point star.</desc>
  <defs>
    <linearGradient id="aGold" x1="55" y1="284" x2="260" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9f652f"/>
      <stop offset=".24" stop-color="#dda95e"/>
      <stop offset=".48" stop-color="#fff0ce"/>
      <stop offset=".72" stop-color="#c68f4c"/>
      <stop offset="1" stop-color="#f6ddaf"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="74" y1="86" x2="286" y2="286" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset=".25" stop-color="#f3dfba"/>
      <stop offset=".52" stop-color="#c99b60"/>
      <stop offset=".78" stop-color="#f8e8c9"/>
      <stop offset="1" stop-color="#b8783c"/>
    </linearGradient>
    <linearGradient id="orbit" x1="34" y1="160" x2="290" y2="155" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9f642f" stop-opacity=".16"/>
      <stop offset=".42" stop-color="#efc57d" stop-opacity=".90"/>
      <stop offset=".72" stop-color="#fff1cf" stop-opacity=".65"/>
      <stop offset="1" stop-color="#99622f" stop-opacity=".12"/>
    </linearGradient>
    <filter id="starGlow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <ellipse cx="162" cy="158" rx="128" ry="54" transform="rotate(-10 162 158)" fill="none" stroke="url(#orbit)" stroke-width="2"/>
  <path d="M55 284 L161 37 L279 284" fill="none" stroke="url(#aGold)" stroke-width="14" stroke-linejoin="miter" stroke-linecap="butt"/>

  <path d="M108 87 C84 86 72 106 83 128 C99 158 155 164 199 182 C226 194 240 214 248 238 C255 259 267 277 284 284" fill="none" stroke="#7f512d" stroke-width="27" stroke-opacity=".48" stroke-linecap="round"/>
  <path d="M108 87 C84 86 72 106 83 128 C99 158 155 164 199 182 C226 194 240 214 248 238 C255 259 267 277 284 284" fill="none" stroke="url(#ribbon)" stroke-width="21" stroke-linecap="round"/>
  <path d="M168 165 C190 184 195 210 185 234 C171 264 137 282 98 284 C82 285 68 284 54 282" fill="none" stroke="url(#ribbon)" stroke-width="13" stroke-linecap="round"/>
  <path d="M102 88 C89 91 82 101 81 111" fill="none" stroke="#fff9ea" stroke-width="3.2" stroke-linecap="round" stroke-opacity=".82"/>

  <g transform="translate(230 96)" fill="#fff0cc" filter="url(#starGlow)"><path d="M0-18 C2-6 6-2 18 0 C6 2 2 6 0 18 C-2 6-6 2-18 0 C-6-2-2-6 0-18Z"/></g>
</svg>
