<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" role="img" aria-labelledby="title desc">
  <title id="title">Sunaria SA monogram</title>
  <desc id="desc">A sharp pointed A woven with a correctly oriented S ribbon, celestial orbit and four-point star.</desc>
  <defs>
    <linearGradient id="metal" x1="160" y1="448" x2="455" y2="70" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#9a5f2f"/><stop offset=".25" stop-color="#d69f58"/><stop offset=".48" stop-color="#fff0ca"/><stop offset=".70" stop-color="#aab4b7"/><stop offset=".86" stop-color="#ead2a6"/><stop offset="1" stop-color="#b8783b"/></linearGradient>
    <linearGradient id="ribbon" x1="207" y1="156" x2="430" y2="413" gradientUnits="userSpaceOnUse"><stop stop-color="#b8793b"/><stop offset=".28" stop-color="#f5d9a6"/><stop offset=".52" stop-color="#fff6df"/><stop offset=".74" stop-color="#d6a15c"/><stop offset="1" stop-color="#8f572f"/></linearGradient>
    <linearGradient id="orbit" x1="58" y1="330" x2="544" y2="248" gradientUnits="userSpaceOnUse"><stop stop-color="#98602f" stop-opacity="0"/><stop offset=".32" stop-color="#d59b50" stop-opacity=".62"/><stop offset=".58" stop-color="#ffe1a7" stop-opacity=".92"/><stop offset=".82" stop-color="#aec5cf" stop-opacity=".32"/><stop offset="1" stop-color="#aec5cf" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <ellipse cx="300" cy="298" rx="263" ry="80" transform="rotate(-24 300 298)" fill="none" stroke="url(#orbit)" stroke-width="1.4"/>

  <!-- Architectural A: very sharp apex and knife-like feet. -->
  <path d="M315 57 L462 448 L404 419 L309 163 L183 448 L215 343 Z" fill="url(#metal)"/>
  <path d="M235 322 L381 307 L390 330 L224 347 Z" fill="url(#metal)" opacity=".92"/>

  <!-- Correct S orientation, with pointed vector ends rather than rounded stroke caps. -->
  <path d="M411 160 C367 126 279 130 235 161 C184 196 199 243 248 268 C277 283 324 291 351 309 C387 332 377 365 343 382 C308 400 252 390 208 363 L236 408 C281 435 349 426 388 398 C443 357 429 308 379 281 C348 265 303 256 271 242 C236 226 230 204 251 186 C281 161 345 156 411 160 Z" fill="url(#ribbon)"/>
  <path d="M402 158 C358 142 292 145 257 169" fill="none" stroke="#fff7e4" stroke-width="4" opacity=".62"/>

  <!-- Weave passes: the A returns over the ribbon at the upper and lower crossings. -->
  <path d="M315 57 L359 175 L329 167 L309 163 L294 196 L270 190 Z" fill="url(#metal)"/>
  <path d="M373 303 L410 328 L462 448 L404 419 Z" fill="url(#metal)"/>
  <path d="M388 398 C420 380 449 359 471 330 L447 383 L402 413 Z" fill="url(#ribbon)"/>

  <g transform="translate(445 130)" fill="#fff0c7" filter="url(#glow)"><path d="M0-27 C3-9 9-3 27 0 C9 3 3 9 0 27 C-3 9-9 3-27 0 C-9-3-3-9 0-27Z"/></g>
</svg>
